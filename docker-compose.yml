services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./secrets/postgres.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - ./secrets/telegram.env
      - ./secrets/telegram-api.env
      - ./secrets/deepseek.env
      - ./secrets/sber.env
      - ./secrets/zai.env
      - ./secrets/postgres.env
      - ./secrets/mail.env
    environment:
      POSTGRES_HOST: db
      CHANNEL_HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
